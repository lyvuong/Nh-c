<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="note-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="6"/>
  
  <!-- Subtle Glowing Rim -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="none" stroke="url(#note-grad)" stroke-width="4" stroke-opacity="0.35"/>

  <!-- Guitar String Fret Lines (Acoustic/Stage Vibe) -->
  <g opacity="0.35" stroke="url(#note-grad)" stroke-width="3" stroke-linecap="round">
    <line x1="160" y1="360" x2="380" y2="160"/>
    <line x1="185" y1="380" x2="405" y2="180"/>
    <line x1="210" y1="400" x2="430" y2="200"/>
  </g>

  <!-- Glowing Soundwave Arcs -->
  <path d="M140 280 C130 200, 190 140, 270 130" stroke="#06b6d4" stroke-width="8" stroke-linecap="round" opacity="0.6" filter="url(#glow)"/>
  <path d="M110 300 C100 170, 200 90, 310 90" stroke="#818cf8" stroke-width="6" stroke-linecap="round" opacity="0.4"/>
  <path d="M370 230 C400 310, 340 400, 250 420" stroke="#f59e0b" stroke-width="8" stroke-linecap="round" opacity="0.6" filter="url(#glow)"/>

  <!-- Stylized Modern 'Nhạc' Musical Note -->
  <g filter="url(#glow)">
    <!-- Stem & Flag -->
    <path d="M230 360 V160 C230 145, 245 135, 260 140 L340 162 C355 166, 365 178, 365 194 V310" 
          stroke="url(#note-grad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Note Heads -->
    <ellipse cx="190" cy="370" rx="46" ry="34" transform="rotate(-24 190 370)" fill="url(#note-grad)"/>
    <ellipse cx="325" cy="320" rx="46" ry="34" transform="rotate(-24 325 320)" fill="url(#note-grad)"/>
    
    <!-- Core highlights -->
    <ellipse cx="185" cy="365" rx="20" ry="12" transform="rotate(-24 185 365)" fill="#ffffff" opacity="0.75"/>
    <ellipse cx="320" cy="315" rx="20" ry="12" transform="rotate(-24 320 315)" fill="#ffffff" opacity="0.75"/>
  </g>
</svg>